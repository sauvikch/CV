<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Sauvik Chakraborty — System Safety Engineer. Connect on LinkedIn.">
<title>Sauvik Chakraborty | System Safety Engineer</title>
<style>
:root{color-scheme:dark;--text:#f6f6f6;--muted:#bcbcbc;--panel:#242424;--stroke:#454545}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
main{width:min(100% - 32px,640px);margin:0 auto;padding:clamp(28px,6vw,70px) 0 52px}
.shell{border:1px solid #383838;border-radius:34px;padding:clamp(12px,3vw,24px)}
.panel{background:var(--panel);border-radius:28px;padding:clamp(24px,5vw,42px) clamp(16px,4vw,34px)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:34px}
.qr-wrap img{width:200px;height:200px;display:block;background:white;border:8px solid white;border-radius:12px;image-rendering:auto}
.qr-caption{font-size:12px;letter-spacing:.03em;color:var(--muted);text-align:center}
.card{background:#050505;border:1px solid var(--stroke);border-radius:26px;padding:clamp(25px,5vw,42px) clamp(18px,4vw,34px)}
h1{font-size:clamp(28px,5.4vw,43px);letter-spacing:-.045em;line-height:1.14;margin:0 0 16px;text-align:center;font-weight:750}
.role{color:#c7c7c7;text-transform:uppercase;font-size:clamp(14px,2.6vw,19px);letter-spacing:.035em;text-align:center;margin:0 0 14px}
.focus{color:#aaa;text-align:center;font-size:clamp(14px,2.5vw,18px);margin:0;line-height:1.5}
.rule{height:1px;background:#444;margin:30px 0 24px}
.links{display:grid;gap:10px}
.links a{color:#f5f5f5;text-decoration:none;display:flex;align-items:center;gap:16px;padding:12px 8px;border-radius:10px;font-size:clamp(15px,2.5vw,19px);font-weight:600;line-height:1.4;transition:background .15s}
.links a:hover,.links a:focus-visible{background:#242424;outline:2px solid transparent}
.links a:focus-visible{outline-color:#ddd;outline-offset:2px}
.links svg{width:24px;height:24px;flex:none;stroke:#b9b9b9;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:420px){main{width:calc(100% - 20px)}.shell{border-radius:24px;padding:10px}.panel{border-radius:19px;padding:22px 12px}.card{border-radius:19px;padding:25px 15px}.qr-wrap{margin-bottom:24px}.qr-wrap img{width:170px;height:170px}.links a{gap:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="shell"><div class="panel">
    <div class="qr-wrap"><img src="qr-code.png" alt="QR code linking to this professional profile" width="200" height="200"><div class="qr-caption">Scan to share this profile</div></div>
    <section class="card" aria-label="Professional profile and contact links">
      <h1>Sauvik Chakraborty</h1>
      <p class="role">System Safety Engineer</p>
      <p class="focus">Functional Safety · Aerospace &amp; Space</p>
      <div class="rule" aria-hidden="true"></div>
      <nav class="links" aria-label="Professional links">
        <a href="https://www.linkedin.com/in/sauvikc" target="_blank" rel="noopener noreferrer" aria-label="Connect on LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8.5" width="4" height="13" rx=".5"/><circle cx="4.5" cy="4.5" r="2"/><path d="M10 21.5v-13h4v2c.9-1.5 2.2-2.3 4-2.3 3 0 4 1.9 4 5.3v8h-4v-7c0-1.6-.4-2.5-1.8-2.5-1.5 0-2.2 1-2.2 2.5v7z"/></svg><span>Connect on LinkedIn</span>
        </a>
      </nav>
    </section>
  </div></div>
</main>
</body></html>
